<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | VacayTours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #102b36;
      --blue: #246a78;
      --cream: #f7f5f0;
      --muted: #697b7e;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--cream);
      color: var(--navy);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .error-container {
      max-width: 540px;
    }

    .error-code {
      font-family: var(--serif);
      font-size: clamp(80px, 15vw, 140px);
      line-height: 1;
      color: var(--blue);
      margin-bottom: 12px;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(28px, 4vw, 38px);
      margin-bottom: 16px;
      font-weight: 600;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .home-btn {
      display: inline-block;
      background-color: var(--navy);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .home-btn:hover {
      background-color: var(--blue);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1>Destination Not Found</h1>
    <p>
      It seems like the path you took doesn't lead anywhere. Don't worry, every great traveler takes a wrong turn once in a while.
    </p>
    <a href="index.html" class="home-btn">Return to Homepage ↗</a>
  </div>
</body>
</html>
